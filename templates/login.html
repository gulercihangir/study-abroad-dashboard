<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In — Study Abroad Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0B1120">
</head>
<body>
  <h1>Log In</h1>

  <div class="letter-box" style="max-width: 400px; margin: 0 auto;">
    {% if error %}
      <p style="color: #F59E0B;">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input type="email" name="email" placeholder="Your email" required />
      <input type="password" name="password" placeholder="Your password" required />
      <br>
      <button type="submit">Log In</button>
    </form>

    <p style="margin-top: 16px;">Don't have an account? <a href="/register" style="color: var(--secondary);">Sign up</a></p>
    <p style="margin-top: 4px;"><a href="/forgot-password" style="color: var(--secondary);">Forgot your password?</a></p>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
