<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consultant Sign Up — Study Abroad Matcher</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1>Consultant Account</h1>

  <div class="letter-box" style="max-width: 400px; margin: 0 auto;">
    {% if error %}
      <p style="color: #F59E0B;">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input type="text" name="name" placeholder="Your name" required />
      <input type="email" name="email" placeholder="Your email" required />
      <input type="password" name="password" placeholder="Choose a password" required />
      <br>
      <button type="submit">Sign Up</button>
    </form>

    <p style="margin-top: 16px;">Already have an account? <a href="/consultant/login" style="color: var(--secondary);">Log in</a></p>
  </div>
</body>
</html>
