<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Study Abroad Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0B1120">
</head>
<body>
  <h1>Forgot Password</h1>

  <div class="letter-box" style="max-width: 400px; margin: 0 auto;">
    {% if message %}
      <p style="color: var(--secondary);">{{ message }}</p>
    {% else %}
      <p>Enter your email and we'll send you a link to reset your password.</p>
      <form method="POST">
        <input type="email" name="email" placeholder="Your email" required />
        <br>
        <button type="submit">Send Reset Link</button>
      </form>
    {% endif %}

    <p style="margin-top: 16px;"><a href="/login" style="color: var(--secondary);">&larr; Back to log in</a></p>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
