<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password — Consultant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0B1120">
</head>
<body>
  <h1>Reset Password</h1>

  <div class="letter-box" style="max-width: 400px; margin: 0 auto;">
    {% if error %}
      <p style="color: #F59E0B;">{{ error }}</p>
    {% endif %}

    {% if not invalid %}
      <form method="POST">
        <input type="password" name="password" placeholder="New password" required />
        <br>
        <button type="submit">Reset Password</button>
      </form>
    {% else %}
      <p><a href="/consultant/forgot-password" style="color: var(--secondary);">Request a new reset link</a></p>
    {% endif %}

    <p style="margin-top: 16px;"><a href="/consultant/login" style="color: var(--secondary);">&larr; Back to log in</a></p>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
